[project]
name = "whisk-gcp-backend"
version = "0.1.0"
description = "Whisk Studio (GCP port) - FastAPI + ADK agent on serverless GCP"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    # --- agent stack ---
    "google-adk[a2a]==2.6.1",
    "google-genai>=1.0",
    # --- managed GCP data plane (only touched when WHISK_MODE=gcp) ---
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-auth>=2.35",
    # --- MCP server/client ---
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
# 110 rather than 88/100: several files carry long regex alternations and SVG
# f-strings that only get less readable when wrapped.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() in defaults is idiomatic
